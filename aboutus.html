Photographer · Graphic Designer · Branding Manager

Neda Shirazi is a visual artist, photographer, graphic designer, and educator with a Master’s degree in Art and Visual Communication.

Her professional practice combines photography, graphic design, visual communication, branding, and advertising, with a particular interest in visual storytelling and creative education. Alongside her professional work, she has taught photography and graphic design at universities and educational institutions, making teaching an important part of her artistic and professional journey.

Neda has also worked as a freelance designer and advertising consultant for a range of organizations and companies. She currently serves as the Branding Manager at Raymon Airlines, where she is involved in developing and managing the company’s visual identity, branding, and advertising activities.

Art, Education & Social Impact

Beyond commercial and academic projects, one of the most meaningful parts of Neda’s work has been her collaboration with students with autism. Through photography-based educational methods, she has explored ways to help students express themselves and communicate through images and visual storytelling.

As part of this work, she organized a group photography exhibition at Tehran Artists’ House, featuring the work of eight autistic students. This experience became one of the most significant and memorable projects of her professional career.

Over the years, Neda has collaborated with universities, educational organizations, and cultural institutions, including **Rasam Art University and Mita Charity, working in different roles as an educator, consultant, designer, and creative professional.

Exhibitions & Publications

Neda has participated in international and group exhibitions, with her works presented at venues and exhibitions in Iran, Italy, Greece, and Turkey, including Tehran Artists’ House, Modica Gallery in Italy, art exhibitions in Athens, and Apollon Art Gallery in Istanbul.

She is also the author of the book “Knowledge of Billboard Design,”published by Chero Publication. In addition, she has contributed to the layout and visual design of several books and publications, including an encyclopedia project focusing on urban geography in Persian literature.

Creative Practice

Her creative work encompasses:

* Photography
* Graphic Design
* Image Editing
* Branding & Visual Identity
* Advertising
* Creative Direction
* Exhibition Curation
* Editorial Design
* Visual Storytelling
* Educational Program Design

Neda works at the intersection of art, education, branding, and visual communication, combining academic experience with practical and commercial projects.">

## Creativity, Experience & Visual Communication

Hi, I’m Alireza Allamezadeh — a web designer and developer, photographer, and visual artist with more than 30 years of experience in art and visual communication.

I am the founder of ANO Art Group, established in collaboration with **Neda Shirazi**. ANO is a creative group working across multiple areas of visual communication, including web design and development, photography, video production, branding, and advertising for commercial, cultural, and institutional clients.

Over the years, we have completed more than 20 creative projects for different organizations and companies, combining artistic vision with practical communication and digital solutions.

Our Approach At ANO, we believe that effective visual communication is more than creating something visually attractive. It is about understanding an idea, finding the right visual language, and transforming it into a clear and meaningful experience.

Our work brings together design, photography, technology, and storytelling to create visual solutions that are both functional and distinctive.

## Photography & Education

Photography has been an important part of my professional and artistic journey for many years. Alongside my professional work, I have trained more than **200 photography students** through educational programs and workshops.

I have also worked with children and teenagers with autism**, using photography and creative activities as educational tools. One of the most meaningful experiences of this work was helping students participate in a group photography exhibition at the Iran Artists’ House in Tehran.

Teaching has become an important part of my creative practice, allowing me to share technical knowledge while encouraging observation, creativity, and visual expression.

Web & Digital Development

My work also extends into digital design and web development. I design and develop websites for businesses and organizations, combining visual design with front-end development and user experience.

My technical experience includes:

* UI/UX Design
* WordPress
* HTML & CSS
* JavaScript
* Bootstrap, Grid & Flexbox
* jQuery & GSAP
* React
* Git & GitHub
* Basic SEO
* Regex

I also work professionally with **Adobe Photoshop, After Effects, Premiere Pro, Lightroom, and Adobe XD**, allowing me to handle projects from initial visual concepts through design, photography, video, and digital implementation.

 Recognition & Experience

My photography has been recognized through international photography competitions and exhibitions, including 35AWARDS (2023–2024), as well as several group exhibitions in leading art galleries in Iran.

Alongside my professional and artistic activities, I am currently developing a comprehensive book on **digital photography**, bringing together technical knowledge and practical experience accumulated over years of working in the field.

## What We Do

Photography
Professional photography, commercial photography, image editing, and visual storytelling.

Web Design & Development

Branding & Advertising
Visual identity, advertising campaigns, creative concepts, and brand communication.

Video Production
Creative video production, editing, motion graphics, and promotional content.

  Beyond Work

Beyond my professional activities, I am interested in travel, coding, cultural studies, cooking, and public speaking — interests that continuously influence the way I observe, learn, and create.
